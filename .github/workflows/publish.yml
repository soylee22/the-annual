name: Refresh and publish
on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 8-22 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: Refresh dated free data
        run: python scripts/refresh.py
      - name: Persist snapshots
        run: |
          git config user.name "soylee22"
          git config user.email "soylee22@users.noreply.github.com"
          git add site/data/live.json site/data/leaders.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh portfolio quotes and year-to-date leaders"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
